name: Launcher builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
      HORIZON_CURSEFORGE_API_KEY: ${{ secrets.HORIZON_CURSEFORGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - name: Build
        working-directory: launcher
        run: cargo build --release --locked --bin horizon-launcher
      - name: Package
        run: Compress-Archive -Path launcher/target/release/horizon-launcher.exe -DestinationPath horizon-launcher-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-launcher
          path: horizon-launcher-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    env:
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
      HORIZON_CURSEFORGE_API_KEY: ${{ secrets.HORIZON_CURSEFORGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - name: Build
        working-directory: launcher
        run: cargo build --release --locked --bin horizon-launcher
      - name: Package
        run: |
          mkdir -p package
          cp launcher/target/release/horizon-launcher package/
          cp packaging/linux/horizon-launcher.desktop packaging/linux/horizon.desktop package/
          cp packaging/icons/hicolor/scalable/apps/horizon.svg package/
          cp LICENSE crates/horizon-theme/fonts/OFL-Geist.txt crates/horizon-theme/fonts/OFL-PixelifySans.txt package/
          tar -czf horizon-launcher-linux-x86_64.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-launcher
          path: horizon-launcher-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-launcher'
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$current" != "$SHA" ]; then
            echo 'A newer main commit exists; skipping this release.'
            exit 0
          fi
          gh release create "build-$RUN_NUMBER-$RUN_ATTEMPT" dist/* --target "$SHA" --title "Build $RUN_NUMBER.$RUN_ATTEMPT" --notes "Launcher build from $SHA" --latest
